# Локальный или серверный запуск одним контейнером. Переменные — в .env (шаблон .env.example).
services:
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      # Токены установки порталов живут здесь; без тома переустановка контейнера их потеряет,
      # и запись ставок не-администраторами перестанет работать до переустановки приложения.
      - portals:/app/.data
    restart: unless-stopped

volumes:
  portals:
