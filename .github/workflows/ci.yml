name: CI

# PR и main: линт → тесты → типы → сборка. Имя джобы `ci` — обязательная проверка в правиле
# защиты `main` (docs/REPO_SETUP_CHECKLIST.md); переименование сломает защиту ветки.
#
# Сторонние actions закреплены полным SHA (supply-chain: изменяемый тег можно переписать и
# выполнить код на раннере с GITHUB_TOKEN). Комментарий `# vX.Y.Z` читает Dependabot и держит
# SHA свежими. SHA сняты из эталона client-bank-alfa-by, где они уже проходят этот CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Версия pnpm берётся из поля "packageManager" в package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        # Генерирует .nuxt/eslint.config.mjs и tsconfig, от которых зависят lint и typecheck.
        run: pnpm exec nuxi prepare

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docker-build:
    name: docker-build
    # Только проверка, что образ собирается; в реестр не публикуем (выкат — docs/DEPLOY.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t invoice-from-tasks:ci .
